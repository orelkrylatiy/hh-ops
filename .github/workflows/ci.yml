name: CI

on:
  push:
    branches: [main, develop, "review/**", "docs/**", "ops/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  automation-quality:
    name: Automation quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r admin/requirements.txt
          pip install ruff==0.16.5 basedpyright pytest pytest-cov

      - name: Ruff critical automation paths
        run: |
          ruff check \
            src/hh_applicant_tool/automation \
            src/hh_applicant_tool/ai/openai.py \
            src/hh_applicant_tool/operations/apply_safe.py \
            src/hh_applicant_tool/operations/manual_chats.py \
            src/hh_applicant_tool/operations/hot_leads.py \
            src/hh_applicant_tool/operations/create_resume.py \
            src/hh_applicant_tool/operations/create_resume_variant.py \
            src/hh_applicant_tool/utils/resume_md.py \
            src/hh_applicant_tool/utils/resume_aliases.py \
            scripts/reply_iterative_ai.py \
            scripts/apply_profile.py \
            scripts/check_ai.py \
            scripts/ops/daily_report.py \
            admin/ui_app.py \
            admin/ui_shell.py \
            tests/test_admin_ui_shell.py \
            tests/test_apply_safe.py \
            tests/test_reply_worker.py \
            tests/test_reply_state.py \
            tests/test_manual_chats.py \
            tests/test_hot_leads.py \
            tests/test_hot_lead_state.py \
            tests/test_hot_leads_operation.py \
            tests/test_hot_leads_operation.py \
            tests/test_create_resume.py \
            tests/test_create_resume_variant.py \
            tests/test_resume_aliases.py \
            tests/test_apply_profile.py \
            tests/test_resume_md.py \
            tests/test_ai_openai_retry.py \
            tests/test_check_ai.py \
            tests/test_ops_daily_report.py \
            --output-format=github

      - name: Ruff format critical automation paths
        run: |
          ruff format --check \
            src/hh_applicant_tool/automation \
            src/hh_applicant_tool/ai/openai.py \
            src/hh_applicant_tool/operations/apply_safe.py \
            src/hh_applicant_tool/operations/manual_chats.py \
            src/hh_applicant_tool/operations/hot_leads.py \
            src/hh_applicant_tool/operations/create_resume.py \
            src/hh_applicant_tool/operations/create_resume_variant.py \
            src/hh_applicant_tool/utils/resume_md.py \
            src/hh_applicant_tool/utils/resume_aliases.py \
            scripts/reply_iterative_ai.py \
            scripts/apply_profile.py \
            scripts/check_ai.py \
            scripts/ops/daily_report.py \
            admin/ui_app.py \
            admin/ui_shell.py \
            tests/test_admin_ui_shell.py \
            tests/test_apply_safe.py \
            tests/test_reply_worker.py \
            tests/test_reply_state.py \
            tests/test_manual_chats.py \
            tests/test_hot_leads.py \
            tests/test_hot_lead_state.py \
            tests/test_hot_leads_operation.py \
            tests/test_hot_leads_operation.py \
            tests/test_create_resume.py \
            tests/test_create_resume_variant.py \
            tests/test_resume_aliases.py \
            tests/test_apply_profile.py \
            tests/test_resume_md.py \
            tests/test_ai_openai_retry.py \
            tests/test_check_ai.py \
            tests/test_ops_daily_report.py

      - name: Type check automation layer
        run: |
          basedpyright \
            src/hh_applicant_tool/automation \
            src/hh_applicant_tool/operations/manual_chats.py \
            src/hh_applicant_tool/operations/hot_leads.py \
            src/hh_applicant_tool/operations/create_resume.py \
            src/hh_applicant_tool/operations/create_resume_variant.py \
            src/hh_applicant_tool/utils/resume_md.py \
            src/hh_applicant_tool/utils/resume_aliases.py \
            scripts/apply_profile.py

      - name: Autonomous reply coverage gate
        run: |
          pytest tests/test_reply_worker.py tests/test_hot_leads.py tests/test_hot_lead_state.py \
            --cov=hh_applicant_tool.automation.reply_worker \
            --cov-report=term-missing \
            --cov-fail-under=75

      - name: Cover-letter fallback regression tests
        run: pytest tests/test_apply_safe.py

      - name: Resume creation regression tests
        run: |
          pytest \
            tests/test_create_resume.py \
            tests/test_create_resume_variant.py \
            tests/test_resume_aliases.py \
            tests/test_apply_profile.py \
            tests/test_resume_md.py

      - name: Admin UI shell regression tests
        run: pytest tests/test_admin_ui_shell.py

      - name: LLM client regression tests
        run: pytest tests/test_ai_openai_retry.py tests/test_check_ai.py

      - name: Runtime snapshot regression tests
        run: pytest tests/test_ops_daily_report.py

      - name: Report legacy lint debt
        continue-on-error: true
        run: ruff check src/ tests/ scripts/ admin/ --statistics

      - name: Report legacy type debt
        continue-on-error: true
        run: basedpyright src/hh_applicant_tool

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r admin/requirements.txt
          pip install pytest pytest-cov

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=src/hh_applicant_tool \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Parse automation scripts
        run: |
          bash -n \
            scripts/apply.sh \
            scripts/apply-profile.sh \
            scripts/setup-ai-resume.sh \
            scripts/reply.sh \
            scripts/cleanup.sh \
            scripts/cron-job.sh \
            scripts/daily.sh \
            scripts/all-profiles.sh \
            scripts/setup-cron.sh \
            scripts/write-runtime-env.sh \
            scripts/ops/daily_publish.sh \
            container-entrypoint.sh \
            startup.sh
          sh -n githooks/pre-commit
      - name: Check automation scripts
        run: |
          # SC1091: runtime .env files intentionally do not exist in CI.
          # SC2016: envsubst variable allow-list is intentionally single quoted.
          shellcheck --exclude=SC1091,SC2016 \
            scripts/apply.sh \
            scripts/apply-profile.sh \
            scripts/setup-ai-resume.sh \
            scripts/reply.sh \
            scripts/cleanup.sh \
            scripts/cron-job.sh \
            scripts/daily.sh \
            scripts/all-profiles.sh \
            scripts/setup-cron.sh \
            scripts/write-runtime-env.sh \
            scripts/ops/daily_publish.sh \
            container-entrypoint.sh \
            startup.sh \
            githooks/pre-commit
      - name: Smoke-test safe script entrypoints
        run: |
          bash scripts/apply.sh --help >/dev/null
          bash scripts/apply-profile.sh --help >/dev/null
          bash scripts/setup-ai-resume.sh --help >/dev/null
          bash scripts/reply.sh --help >/dev/null
          bash scripts/cleanup.sh --help >/dev/null

          fake_resume_bin="$(mktemp -d)"
          setup_args="$(mktemp)"
          cat > "$fake_resume_bin/hh-applicant-tool" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$AI_RESUME_SETUP_ARGS"
          EOF
          chmod +x "$fake_resume_bin/hh-applicant-tool"
          AI_RESUME_SETUP_ARGS="$setup_args" PATH="$fake_resume_bin:$PATH" \
            bash scripts/setup-ai-resume.sh --profile 0555 --dry-run
          grep -qx -- '--profile-id' "$setup_args"
          grep -qx -- '0555' "$setup_args"
          grep -qx -- 'create-resume-variant' "$setup_args"
          grep -qx -- '--alias' "$setup_args"
          grep -qx -- 'ai-engineer' "$setup_args"
          grep -qx -- '--publish' "$setup_args"
          grep -qx -- '--dry-run' "$setup_args"

          make -n schedule >/dev/null
          make -n unschedule >/dev/null
          HH_AUTOMATION_MODE=off bash scripts/cron-job.sh apply >/dev/null

          fake_bin="$(mktemp -d)"
          cleanup_args="$(mktemp)"
          cat > "$fake_bin/hh-applicant-tool" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$CLEANUP_ARGS_FILE"
          EOF
          chmod +x "$fake_bin/hh-applicant-tool"
          CLEANUP_ARGS_FILE="$cleanup_args" PATH="$fake_bin:$PATH" \
            bash scripts/cleanup.sh --profile test-profile --dry-run
          grep -qx -- '--no-auto-auth' "$cleanup_args"
          grep -qx -- '--profile-id' "$cleanup_args"
          grep -qx -- 'test-profile' "$cleanup_args"
          grep -qx -- 'clear-negotiations' "$cleanup_args"
          grep -qx -- '--delete-chat' "$cleanup_args"
          grep -qx -- '--dry-run' "$cleanup_args"
          ! grep -q -- '--blacklist' "$cleanup_args"
          ! grep -q -- '--block-ats' "$cleanup_args"
          python3 scripts/ops/daily_report.py --date today --root "$(mktemp -d)" --output-dir "$(mktemp -d)" >/dev/null
      - name: Smoke-test cron runtime environment
        run: |
          runtime_env="$(mktemp)"
          HH_AUTOMATION_MODE=live \
          CONFIG_DIR=/tmp/hh-config \
          TZ=Europe/Tallinn \
          HH_NAME='Test User' \
          HH_TELEGRAM='@test_user' \
          SEARCH_QUERY='React TypeScript developer' \
          APPLY_LIMIT=17 \
          APPLY_PER_PAGE=42 \
          APPLY_PAGES=3 \
          APPLY_RUN_TIMEOUT=777 \
          REPLY_CHATS=23 \
          CLEANUP_DELETE_CHAT=0 \
          HH_PROFILE_PARALLELISM=7 \
            bash scripts/write-runtime-env.sh "$runtime_env"

          # shellcheck disable=SC1090
          source "$runtime_env"
          test "$HH_AUTOMATION_MODE" = live
          test "$CONFIG_DIR" = /tmp/hh-config
          test "$TZ" = Europe/Tallinn
          test "$HH_NAME" = 'Test User'
          test "$HH_TELEGRAM" = '@test_user'
          test "$SEARCH_QUERY" = 'React TypeScript developer'
          test "$APPLY_LIMIT" = 17
          test "$APPLY_PER_PAGE" = 42
          test "$APPLY_PAGES" = 3
          test "$APPLY_RUN_TIMEOUT" = 777
          test "$REPLY_CHATS" = 23
          test "$CLEANUP_DELETE_CHAT" = 0
          test "$HH_PROFILE_PARALLELISM" = 7
      - name: Smoke-test automatic profile discovery
        run: |
          fake_bin="$(mktemp -d)"
          config_root="$(mktemp -d)"
          logs="$(mktemp -d)"
          locks="$(mktemp -d)"
          mkdir -p "$config_root/account-only"
          printf '{}\n' > "$config_root/account-only/config.json"
          cat > "$fake_bin/hh-applicant-tool" <<'EOF'
          #!/usr/bin/env bash
          printf '%s\n' "$@" > "$PROFILE_DISCOVERY_ARGS"
          EOF
          chmod +x "$fake_bin/hh-applicant-tool"
          PROFILE_DISCOVERY_ARGS="$(mktemp)" \
          CONFIG_DIR="$config_root" \
          HH_PROFILES_LOG_DIR="$logs" \
          HH_PROFILES_LOCK_DIR="$locks" \
          PATH="$fake_bin:$PATH" \
            bash scripts/all-profiles.sh refresh
          grep -q 'profile=account-only command=refresh' "$logs/account-only-refresh.log"

      - name: Smoke-test ten concurrent profiles
        run: |
          fake_bin="$(mktemp -d)"
          logs="$(mktemp -d)"
          locks="$(mktemp -d)"
          cat > "$fake_bin/hh-applicant-tool" <<'EOF'
          #!/usr/bin/env bash
          sleep 0.05
          exit 0
          EOF
          chmod +x "$fake_bin/hh-applicant-tool"
          PROFILES="account1 account2 account3 account4 account5 account6 account7 account8 account9 account10" \
          HH_PROFILE_PARALLELISM=10 \
          HH_PROFILES_LOG_DIR="$logs" \
          HH_PROFILES_LOCK_DIR="$locks" \
          PATH="$fake_bin:$PATH" \
            bash scripts/all-profiles.sh refresh
          test "$(find "$logs" -name '*-refresh.log' | wc -l)" -eq 10
          grep -q 'HH_RUN_START profile=account1 command=refresh mode=utility' "$logs/account1-refresh.log"
          grep -q 'HH_RUN_END profile=account1 command=refresh mode=utility status=0' "$logs/account1-refresh.log"

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
